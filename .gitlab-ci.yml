# The platform's own CI:
# test and validate on every MR and main push, and deploy the console to dev from main. On a
# vX.Y.Z tag: push the dbt, runtime and console images, deploy and run the release gate (e2e/)
# on dev, then publish the package and the GitLab Release, and redeploy every bundle on
# "latest" from its saved files: dev at once, prod when someone starts rollout-prod. A bundle
# pinned to a release moves by its own MR.
stages: [test, deploy, release, gate, publish, rollout]

variables:
  # Where the release pushes the dbt, runtime and console images; gcpbricks.infra's
  # DBT_IMAGE_REPO and environments.RUNTIME_REPO read them from the same place.
  IMAGE_REPO: us-central1-docker.pkg.dev/my-gcp-project/mlops

test:
  stage: test
  tags: [docker]
  image: python:3.11-slim
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    # `mlops bundle deploy` reads the commit and the files to upload from git.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - pip install --quiet -e ".[dev]"
    - ruff check src tests
    - pytest -q

# Temporarily disabled.
# The feature store's Spark engine against the DuckDB one: pyspark 4 needs Java 17, which
# the plain test image lacks, so its tests skip there and run here.
